name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x *.sh tests/*.sh

  e2e:
    # Real backup and restore against PostgreSQL and an S3 API (moto), not just a lint.
    needs: shellcheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: start an S3-compatible server (moto)
        run: |
          pipx install 'moto[server]'
          moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:9000/ >/dev/null && break; sleep 1; done
      - name: client tools
        run: |
          pg_dump --version   # must not be newer than the server it restores into
          aws --version
          aws configure set default.s3.addressing_style path
      - run: tests/e2e.sh
